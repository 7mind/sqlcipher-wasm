name: CI/CD

on:
  push:
    branches: [main, master, develop]
    tags:
      - 'v*'
  pull_request:
    branches: [main, master]
  release:
    types: [created]

jobs:
  build-test-publish:
    name: Build, Test & Publish
    runs-on: ubuntu-latest
    permissions:
      contents: write
      id-token: write

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Install Nix
        uses: cachix/install-nix-action@v25
        with:
          nix_path: nixpkgs=channel:nixos-unstable
          extra_nix_config: |
            experimental-features = nix-command flakes
            access-tokens = github.com=${{ secrets.GITHUB_TOKEN }}

      - name: Setup Node.js (for publishing)
        if: (github.event_name == 'release' && github.event.action == 'created') || (github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v'))
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          registry-url: "https://registry.npmjs.org"

      - name: Cache Emscripten
        uses: actions/cache@v3
        with:
          path: .emscripten-cache
          key: ${{ runner.os }}-emscripten-${{ hashFiles('flake.lock') }}
          restore-keys: |
            ${{ runner.os }}-emscripten-

      - name: Build WASM: OpenSSL + SQLCipher
        run: |
          nix develop --command bash -c "./build-openssl.sh && ./build-wasm.sh"

      - name: Build WebGL: OpenSSL + SQLCipher
        run: |
          nix develop '.#webgl' --command bash -c "./build-openssl.sh && ./build-webgl.sh"

      - name: Prepare cross-platform test
        run: |
          nix develop --command bash -c "./tools/prepare-cross-platform-test.sh"

      - name: Run all tests
        run: |
          nix develop --command bash -c "npm test"

      - name: Run benchmarks
        run: |
          nix develop --command bash -c "npm run bench"

      - name: Check build artifacts
        run: |
          ls -lh dist/
          test -f dist/sqlcipher.cjs
          test -f dist/sqlcipher.mjs
          test -f dist/sqlcipher.wasm
          ls -lh target/results/
          test -f target/results/sqlcipher-wasm.zip
          test -f target/results/sqlcipher-webgl.zip

      - name: Upload WASM archive
        uses: actions/upload-artifact@v4
        with:
          name: sqlcipher-wasm
          path: target/results/sqlcipher-wasm.zip
          retention-days: 30

      - name: Upload WebGL archive
        uses: actions/upload-artifact@v4
        with:
          name: sqlcipher-webgl
          path: target/results/sqlcipher-webgl.zip
          retention-days: 30

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-results
          path: |
            test/*.log
          if-no-files-found: ignore

      # Publishing steps (only run on tags)
      - name: Verify package contents
        if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')
        run: |
          npm pack --dry-run
          ls -lh dist/

      - name: Publish to NPM
        if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')
        run: nix develop --command npm publish --provenance --access public

      - name: Create GitHub Release
        if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v1
        with:
          files: |
            target/results/sqlcipher-wasm.zip
            target/results/sqlcipher-webgl.zip
          generate_release_notes: true
